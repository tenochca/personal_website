{% extends "base.html" %}

{% block nav %}
<p>
    ANALYZING..<br>
    LOG ID: {{ log.id }} <br>
    FILE TYPE: log file <br>
    TOPIC: {{ log.title }} <br>
    DATE: {{ log.formatted_created_at }}
</p>
<div class="ascii-line" id="ascii-line"></div>
{% endblock %}

{% block content %}
<p>{{ log.message }}</p>
<button onclick="deleteLog('{{ log.id }}')">Delete</button>
{% endblock %}

{% block script %}
    <script src="{{ url_for('static', path='scripts/ascii_line.js') }}"></script>

    <script>
    async function deleteLog(logId) {
        if (!confirm("Delete this log?")) return;

        const response = await fetch(`/logs/${logId}`, {
            method: "DELETE",
        });

        if (response.ok) {
            window.location.href = "/logs";
        } else {
            alert("Failed to delete log.");
        }
    }
    </script>
{% endblock %}
