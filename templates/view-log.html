{% include "base.html" %}

<body>
    <div class="terminal">
    <main>
        <p>{{ log.message }}</p>
        <button onclick="deleteLog('{{ log.id }}')">Delete</button>
    </main>
    </div>

    <script>
    async function deleteLog(logId) {
        if (!confirm("Delete this log?")) return;

        const response = await fetch(`/logs/${logId}`, {
            method: "DELETE",
        });

        if (response.ok) {
            window.location.href = "/logs";
        } else {
            alert("Failed to delete log.");
        }
    }
    </script>

</body>
