{% include "base.html" %}
<body>
    <div class="terminal">
        <div class="hero-row">
    <header class="ascii-header">
        <pre class="ascii-art">
 __     __    ___  ____
(  )   /  \  / __)/ ___)
/ (_/\(  O )( (_ \\___ \
\____/ \__/  \___/(____/
        </pre>
    </header>
    <a href="/logs/new" class="node">create log</a>
    <div class="hero-image-wrap">
        <img src="{{ url_for('static', path='media/posada4.png') }}" class="hero-image"/>
    </div>
        </div>
   	    <main>
		    <nav class="nav">
                   <a href='/about' class="node">about</a>
                   <a href="/logs" class="node"> logs</a>
                   <a href="/projects" class="node"> projects</a>
               </nav>
	    </main>
        <main>
                {% for log in log_messages %}
                    <div id="log-{{ log.id }}" class="node">
                        <p>{{ log.message }}</p>
                        <p>{{  log.created_at }}</p>
                        <p>{{ log.id }}</p>
                        <button onclick="deleteLog('{{ log.id }}')">Delete</button>
                    </div>
                {% endfor %}
        </main>
    </div>

<script>
async function deleteLog(logId) {
    if (!confirm("Delete this log?")) return;

    const response = await fetch(`/logs/${logId}`, {
        method: "DELETE",
    });

    if (response.ok) {
        document.getElementById(`log-${logId}`).remove();
    } else {
        alert("Failed to delete log.");
    }
}
</script>

</body>
